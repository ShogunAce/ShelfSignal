AWSTemplateFormatVersion: '2010-09-09'
Description: Optional build infrastructure for a NEW ShelfSignal account (existing account already has these resources)
Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: shelfsignal
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep the last ten images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'
  Source:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'shelfsignal-build-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: source-retention
            Status: Enabled
            ExpirationInDays: 30
  BuildLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/codebuild/shelfsignal-build
      RetentionInDays: 7
  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BuildOnlyShelfSignal
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${Source.Arn}/*'
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource: !GetAtt Repository.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt BuildLogs.Arn
  Build:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: shelfsignal-build
      ServiceRole: !GetAtt BuildRole.Arn
      TimeoutInMinutes: 15
      ConcurrentBuildLimit: 1
      Source:
        Type: S3
        Location: !Sub '${Source}/source.zip'
        BuildSpec: infrastructure/buildspec.yml
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
Outputs:
  SourceBucket:
    Value: !Ref Source
  BuildProject:
    Value: !Ref Build
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
