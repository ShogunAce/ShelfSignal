version: 0.2
phases:
  pre_build:
    commands:
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REGISTRY=$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - IMAGE_URI=$REGISTRY/shelfsignal:${IMAGE_TAG:-competition}
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
  build:
    commands:
      - docker build --platform linux/amd64 -f infrastructure/Dockerfile -t "$IMAGE_URI" .
      - docker run --rm --entrypoint python "$IMAGE_URI" -c "import cv2,numpy,platform; assert cv2.__version__.startswith('5.'); assert platform.machine()=='x86_64'; print(cv2.__version__,numpy.__version__,platform.machine())"
  post_build:
    commands:
      - test "$CODEBUILD_BUILD_SUCCEEDING" = "1"
      - docker push "$IMAGE_URI"
