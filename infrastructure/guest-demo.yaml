AWSTemplateFormatVersion: '2010-09-09'
Description: Bounded synthetic demo gateway for the private ShelfSignal processor
Parameters:
  CodeBucket: {Type: String}
  CodeKey: {Type: String}
  SiteOrigin: {Type: String, Default: 'https://shelf-signals.netlify.app'}
Resources:
  Sessions:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: id, AttributeType: S}]
      KeySchema: [{AttributeName: id, KeyType: HASH}]
      SSESpecification: {SSEEnabled: true}
      TimeToLiveSpecification: {AttributeName: expires, Enabled: true}
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BoundedDemo
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt Sessions.Arn
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:shelfsignal-processor'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt Logs.Arn
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/shelfsignal-guest-demo
      RetentionInDays: 7
  Gateway:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: shelfsignal-guest-demo
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt Role.Arn
      MemorySize: 512
      Timeout: 29
      Code: {S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey}
      Environment:
        Variables:
          SESSION_TABLE: !Ref Sessions
          PROCESSOR: shelfsignal-processor
          SITE_ORIGIN: !Ref SiteOrigin
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: shelfsignal-guest-demo
      ProtocolType: HTTP
  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Gateway.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 29000
  Route:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: '$default'
      Target: !Join ['/', ['integrations', !Ref Integration]]
  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings: {ThrottlingBurstLimit: 20, ThrottlingRateLimit: 10}
  Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Gateway
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*'
Outputs:
  ApiUrl:
    Value: !GetAtt Api.ApiEndpoint
